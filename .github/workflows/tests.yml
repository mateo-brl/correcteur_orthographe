name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache de Grammalecte
        id: cache-grammalecte
        uses: actions/cache@v4
        with:
          path: vendor
          key: grammalecte-2.3.0-${{ runner.os }}-py${{ matrix.python }}

      - name: Téléchargement de Grammalecte
        if: steps.cache-grammalecte.outputs.cache-hit != 'true'
        run: python -m correcteur installer grammalecte --dossier vendor

      - name: Tests (Linux, bureau X11 virtuel)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          XDG_SESSION_TYPE: x11
        run: xvfb-run -a -s "-screen 0 1280x800x24 +extension RECORD" python -m pytest -v -rs

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        env:
          CORRECTEUR_TESTS_BUREAU: "1"
        run: python -m pytest -v -rs
