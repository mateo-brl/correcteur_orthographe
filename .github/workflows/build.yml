name: Construction

# Une version est publiée automatiquement quand on pousse un tag v* (ex. v0.1.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Paquet ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04  # glibc plus ancienne : compatible avec plus de distributions
            name: linux
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bibliothèques système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")-dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          python -m correcteur installer grammalecte --dossier vendor
          python packaging/make_icons.py

      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/correcteur.spec

      - name: Test de l'exécutable (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/Correcteur/correcteur corriger --hors-ligne "Je vais a la plage , et il faut que tu viens." > sortie.txt
          python -c "t = open('sortie.txt', encoding='utf-8').read(); print(t); assert 'à la plage, et' in t"

      - name: Test de l'exécutable (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          dist\Correcteur\correcteur-cli.exe corriger --hors-ligne "Je vais a la plage , et il faut que tu viens." > sortie.txt
          python -c "t = open('sortie.txt', encoding='utf-8').read(); print(t); assert 'à la plage, et' in t"

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          cp scripts/installer-linux.sh dist/Correcteur/
          tar -C dist -czf "dist/Correcteur-${VERSION}-linux-x86_64.tar.gz" Correcteur

      - name: Installateur et version portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DMyAppVersion=$env:VERSION" packaging\correcteur.iss
          Compress-Archive -Path dist\Correcteur -DestinationPath "dist\Correcteur-$env:VERSION-windows-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: correcteur-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publication
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquets/*
          generate_release_notes: true
